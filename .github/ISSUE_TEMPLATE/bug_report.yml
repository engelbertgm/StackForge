name: Bug report
description: Something on the canvas, a panel or import/export does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import examples/stress-test.json
        2. Click Re-arrange
        3. ...
    validations:
      required: true
  - type: textarea
    id: stack
    attributes:
      label: Stack JSON
      description: If the bug depends on what is on the canvas, use Export and paste the JSON here. Remove any saved usernames, passwords or notes first.
      render: json
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here if it helps.
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140, Windows 11
    validations:
      required: true

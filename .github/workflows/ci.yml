name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # catalog integrity, rule engine and wire router
      - run: pnpm check

      - run: pnpm lint

      - run: pnpm typecheck

      # dead exports and duplicated code
      - run: pnpm knip

      - run: pnpm dup

      # tsc runs as part of build
      - run: pnpm build

summary: "StackForge is a local-running tool that suggests which technology stack to use based on your needs. You drop technologies on a canvas and it shows conflicts, missing pieces and connections. Everything runs in the browser: no backend, no accounts, no telemetry. It is a suggestion tool, not a SaaS, and has no legal surface. English only."
